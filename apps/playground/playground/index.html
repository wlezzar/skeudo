<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skeudo Playground</title>
    <meta name="description" content="Write a Skeudo sketch and see it rendered as you type." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/" title="Skeudo home"><span class="brand-mark">::</span>Skeudo <span class="brand-sub">playground</span></a>
      <label class="field">
        <span>Example</span>
        <select id="example"></select>
      </label>
      <label class="field">
        <span>Mode</span>
        <select id="mode">
          <option value="auto">Auto</option>
          <option value="sketch">Sketch</option>
          <option value="markdown">Markdown</option>
        </select>
      </label>
      <label class="field grow">
        <span>Source links</span>
        <input id="src-base" type="url" placeholder="Base URL for sketches without ::repo, e.g. https://github.com/org/repo/blob/main/" />
      </label>
      <a class="icon-btn" href="https://github.com/wlezzar/skeudo" title="Skeudo on GitHub" aria-label="Skeudo on GitHub">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button id="theme" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </header>
    <main class="split">
      <section class="pane">
        <div class="pane-head">
          <span>Source</span>
          <span id="status" class="status"></span>
        </div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </section>
      <section class="pane">
        <div class="pane-head tabs" role="tablist">
          <button role="tab" data-tab="preview" aria-selected="true">Preview</button>
          <button role="tab" data-tab="review">Review <span id="review-count" class="count"></span></button>
          <button role="tab" data-tab="ast">AST</button>
        </div>
        <div class="panels">
          <div id="preview" class="panel" data-panel="preview"></div>
          <div id="review" class="panel" data-panel="review" hidden></div>
          <div id="ast" class="panel" data-panel="ast" hidden><pre></pre></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
